services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      DIAGNOSTIC_PAGE: "${DIAGNOSTIC_PAGE:-false}"
      SPACE_67_KEYBOARD: "${SPACE_67_KEYBOARD:-false}"
      DISABLE_ANTI_CHEAT: "${DISABLE_ANTI_CHEAT:-false}"
      CLIENT_SIM: "${CLIENT_SIM:-true}"
      VERIFY_SCORE_THRESHOLD: "${VERIFY_SCORE_THRESHOLD:-50}"
      FLAG: "${FLAG:-grey{placeholder_6767}}"
    expose:
      - "8787"
    restart: unless-stopped

  webserver:
    image: nginx:latest
    container_name: nginx_web
    depends_on:
      - backend
    environment:
      SERVER_NAME: "${SERVER_NAME:-_}"
      CERTBOT_DOMAIN: "${CERTBOT_DOMAIN:-${SERVER_NAME:-localhost}}"
      DOLLAR: "$"
    ports:
      - "${APP_PORT:-36767}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
